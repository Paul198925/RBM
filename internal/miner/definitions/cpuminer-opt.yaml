# cpuminer-opt by JayDDee, an open-source CPU miner for many algorithms.
# https://github.com/JayDDee/cpuminer-opt
#
# Windows only: the project publishes no Linux build. The archive holds one
# program per instruction set; the AVX2 one runs on about every CPU built
# since 2014. The checksum is the one GitHub publishes for the release file.
name: cpuminer-opt
version: "26.1"
api: ccminer
vendor: CPU
fee: 0

downloads:
  windows:
    url: https://github.com/JayDDee/cpuminer-opt/releases/download/v26.1/cpuminer-opt-26.1-windows.zip
    sha256: caf59deb12831e40475c5245a76bf42f9ba2ff620065be5386b80ec55c998e9c
    executable: cpuminer-avx2.exe

args:
  - -a
  - "{algo}"
  - -o
  - "{scheme}://{host}:{port}"
  - -u
  - "{user}"
  - -p
  - "{pass}"
  # address of the API
  - -b
  - "127.0.0.1:{api_port}"
  - -q

# added when the number of threads is limited in the configuration
threads_args:
  - -t
  - "{threads}"

scheme: stratum+tcp
scheme_tls: stratum+ssl

# A selection of what zpool.ca offers for CPUs: the algorithms that need no
# further parameters.
algorithms:
  - name: lyra2z330
  - name: m7m
  - name: minotaurx
  - name: yescrypt
  - name: yescryptr8
  - name: yescryptr16
  - name: yescryptr32
  - name: yespower
  - name: yespowerr16
  # more of zpool.ca's algorithms that are mined with CPUs
  - name: argon2d500
  - name: argon2d1000
  - name: argon2d4096
  - name: argon2d16000
  - name: hmq1725
  - name: scryptn2
  - name: timetravel
  # yespower with the parameters of one coin each
  - name: yespoweradvc
    miner_name: yespower
    args: ["--param-n", "2048", "--param-r", "32", "--param-key", "Let the quest begin"]
  - name: yespowerltncg
    miner_name: yespower
    args: ["--param-n", "2048", "--param-r", "32", "--param-key", "LTNCGYES"]
  - name: yespowermgpc
    miner_name: yespower
    args: ["--param-n", "2048", "--param-r", "32", "--param-key", "Magpies are birds of the Corvidae family."]
  - name: power2b
    miner_name: yespower-b2b
    args: ["--param-n", "2048", "--param-r", "32", "--param-key", "Now I am become Death, the destroyer of worlds"]
  - name: yespowersugar
    miner_name: yespower
    args: ["--param-n", "2048", "--param-r", "32", "--param-key", "Satoshi Nakamoto 31/Oct/2008 Proof-of-work is essentially one-CPU-one-vote"]
  - name: yespowertide
    miner_name: yespower
    args: ["--param-n", "2048", "--param-r", "8"]
  - name: yespowerurx
    miner_name: yespower
    args: ["--param-n", "2048", "--param-r", "32", "--param-key", "UraniumX"]
