# ccminer, the tpfuemp fork: an open source NVIDIA miner for many of the
# smaller algorithms. https://github.com/tpfuemp/ccminer-tpfuemp
name: ccminer-tpfuemp
version: 2026.09.2
api: ccminer
vendor: NVIDIA
fee: 0

downloads:
  windows:
    url: https://github.com/tpfuemp/ccminer-tpfuemp/releases/download/v2026.09.2/ccminer-tpfuemp-2026.09.2-windows-x64.zip
    sha256: 6e1aa25c9dc44be6c8257024c461ff507c7b1e98b37f8ba3bf873f75073b6884
    executable: ccminer.exe
  linux:
    url: https://github.com/tpfuemp/ccminer-tpfuemp/releases/download/v2026.09.2/ccminer-tpfuemp-2026.09.2-linux-x64.tar.gz
    sha256: d28a73874ca247a76046aa391d30ffbed7ba1782050f73ab1ec576da50d86f7d
    executable: ccminer

# What the program needs from the system beyond what every system has: the
# libraries it imports and does not bring along. Read from the downloads;
# the test TestListDependencies checks it against them.
requires:
  windows: [nvcuda.dll, vcruntime140.dll, vcruntime140_1.dll]
  linux: [libcrypto.so.3, libcuda.so.1, libcurl.so.4, libgcc_s.so.1, libgomp.so.1, libjansson.so.4, libstdc++.so.6]

args:
  - -a
  - "{algo}"
  - -o
  - "{scheme}://{host}:{port}"
  - -u
  - "{user}"
  - -p
  - "{pass}"
  - -d
  - "{devices}"
  # address of the API
  - -b
  - 127.0.0.1:{api_port}
  # quiet: no per-share output
  - -q
  # seconds to wait before a retry when the pool cannot be reached
  - -R
  - "1"

scheme: stratum+tcp
scheme_tls: stratum+ssl

# A selection of what zpool.ca offers and this fork mines; it supports many
# more. The names are zpool's, miner_name is given where ccminer differs.
algorithms:
  - name: allium
  - name: flex
  - name: hoohashpepew
    miner_name: hoohash
  - name: mike
  - name: minotaurx
  - name: rinhash
  - name: verushash
    miner_name: verus
  - name: x16rt
  - name: yescrypt
  - name: yescryptr8
  - name: yescryptr16
  - name: yespower
  - name: yespowerr16
  - name: yespowereqpay
  # The rest of what zpool.ca offers and this program knows, by its own list
  # of algorithms. Left out are the ones that ASICs or FPGAs mine, where a
  # graphics card earns next to nothing: equihash, groestl, lyra2v2, myrgr,
  # neoscrypt, odocrypt, quark, qubit, scrypt, sha256, skein, tribus, x11
  # and x13.
  - name: argon2d500
  - name: argon2d1000
  - name: argon2d4096
  - name: argon2d16000
  - name: balloon
  - name: equihash192
    min_memory_mib: 4096
  - name: hmq1725
  - name: neoscryptxaya
    miner_name: xaya
  - name: sha3256t
    miner_name: sha3t
  - name: soterg
  - name: timetravel
  - name: whirlpool
  - name: whirlpoolx2
  - name: x16rv2
  - name: x21s
  - name: x25x
  - name: yespoweradvc
  - name: yespowerltncg
  - name: yespowermgpc
  - name: yespowersmt
  # Algorithms that other miner programs mine too. Whichever is fastest on
  # a card is used; the memory figures are those of the other programs.
  - name: anime
  - name: bmw512
  - name: curve
    miner_name: curvehash
  - name: equihash144
    min_memory_mib: 2048
  - name: evrprogpow
    min_memory_mib: 6144
  - name: firopow
    min_memory_mib: 6144
  - name: ghostrider
  - name: heavyhash
  - name: kawpow
    min_memory_mib: 6144
  - name: lyra2z330
  - name: meowpow
    min_memory_mib: 6144
  - name: meraki
    min_memory_mib: 6144
  - name: power2b
  - name: sha512256d
  - name: skein2
  - name: skydoge
  - name: yescryptr32
  - name: yespowersugar
  - name: yespowertide
  - name: yespowerurx
