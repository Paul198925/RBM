# Rigel, a closed-source NVIDIA GPU miner: https://github.com/rigelminer/rigel
name: rigel
version: 1.23.2
api: rigel
vendor: NVIDIA
# developer fee in percent, unless an algorithm says otherwise
fee: 0.7

downloads:
  windows:
    url: https://github.com/rigelminer/rigel/releases/download/1.23.2/rigel-1.23.2-win.zip
    sha256: 0a35d37504e2595f2cd9bb25ae69eae39625be6f0ebbdbaf7427d4c381a7fd79
    executable: rigel.exe
  linux:
    url: https://github.com/rigelminer/rigel/releases/download/1.23.2/rigel-1.23.2-linux.tar.gz
    sha256: eae492ffb64aeb4ab4ba7e66631567984a31d5adb1ef547bda6601aee1793f0d
    executable: rigel

# one list entry per command line argument; {placeholders} are filled in
args:
  - --api-bind
  - 127.0.0.1:{api_port}
  - -d
  - "{devices}"
  - -a
  - "{algo}"
  - -o
  - "{scheme}://{host}:{port}"
  - -u
  - "{user}"
  - -p
  - "{pass}"
  - --no-tui
  - --no-watchdog

# how the stratum connection is spelled, without and with TLS
scheme: stratum+tcp
scheme_tls: stratum+ssl

algorithms:
  # min_memory_mib is a rough lower bound for the DAG of the coins a pool
  # mines with this algorithm, not an exact figure
  - name: kawpow
    fee: 1.0
    min_memory_mib: 6144
  - name: sha512256d
    fee: 1.0
    min_memory_mib: 2048
  # the algorithms below are mined at coin pools; they were added from
  # Rigel's documentation and the size of the coins' data in October 2026
  - name: autolykos2
    fee: 1.0
    min_memory_mib: 7400
  - name: etchash
    min_memory_mib: 5120
  - name: ethash
    min_memory_mib: 7680
  - name: nexapow
    fee: 2.0
    min_memory_mib: 3072
